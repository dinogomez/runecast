name: CI

on:
  push:
    branches: [dev, main]
    paths-ignore: ["site/**"]
  pull_request:
    paths-ignore: ["site/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Rune links these on Linux (see Rune's README).
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev

      # rustup reads the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

  # Release notes and version bumps are read from commit subjects, so new ones must follow
  # https://www.conventionalcommits.org/en/v1.0.0/ (and a pull request's title, for squash merges).
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          subjects=()
          if [ -n "$TITLE" ]; then
            subjects+=("$TITLE")
          fi
          # A new branch has no "before" to compare against.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            while IFS= read -r subject; do
              subjects+=("$subject")
            done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          fi
          .github/scripts/changelog.sh lint "${subjects[@]}"
