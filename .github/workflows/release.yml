name: Release

# Builds Runecast.app (Apple Silicon and Intel in one binary) and a Linux tarball for a vX.Y.Z tag
# and publishes them as a GitHub Release. Promote runs this after it tags main; pushing a tag by
# hand works too.
#
# With these repository secrets the app is signed with a Developer ID and sent to Apple for
# notarization, and the release is published without waiting for Apple: the Staple workflow
# staples the ticket and replaces the downloads once Apple accepts the build. Without them the
# app is ad-hoc signed (macOS warns on first open).
#   MACOS_CERT_P12        Developer ID Application certificate, base64-encoded .p12
#   MACOS_CERT_PASSWORD   its password
#   APPLE_API_KEY         App Store Connect API key, the .p8 file's contents
#   APPLE_API_KEY_ID      the key's ID
#   APPLE_API_ISSUER      the key's issuer ID

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  macos:
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
      submission: ${{ steps.notarize.outputs.submission }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Make Runecast.app
        run: |
          app=dist/Runecast.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/runecast" \
            target/aarch64-apple-darwin/release/runecast target/x86_64-apple-darwin/release/runecast

          iconset=$(mktemp -d)/Runecast.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            sips -z $((size * 2)) $((size * 2)) assets/icon.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/Runecast.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Runecast</string>
            <key>CFBundleDisplayName</key><string>Runecast</string>
            <key>CFBundleIdentifier</key><string>dev.runecast.launcher</string>
            <key>CFBundleExecutable</key><string>runecast</string>
            <key>CFBundleIconFile</key><string>Runecast</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSAppleEventsUsageDescription</key><string>Runecast moves windows and pastes snippets through System Events.</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"

      - name: Sign
        id: sign
        run: |
          app=dist/Runecast.app
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::No Developer ID certificate in secrets; the app is ad-hoc signed and macOS will warn on first open."
            codesign --force --deep --sign - "$app"
          else
            identity=$(.github/scripts/developer-id.sh)
            codesign --force --options runtime --timestamp --sign "$identity" "$app"
            echo "IDENTITY=$identity" >> "$GITHUB_ENV"
            echo "signed=1" >> "$GITHUB_OUTPUT"
          fi
          codesign --verify --strict --verbose=2 "$app"

      # Submits without waiting: Apple can take minutes or days, and Staple finishes the job.
      - name: Send to Apple for notarization
        id: notarize
        if: steps.sign.outputs.signed == '1'
        run: |
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent dist/Runecast.app "$RUNNER_TEMP/notarize.zip"
          submission=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --output-format json \
            --key "$RUNNER_TEMP/key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" | jq -r .id)
          rm "$RUNNER_TEMP/key.p8"
          echo "Apple submission: $submission"
          echo "submission=$submission" >> "$GITHUB_OUTPUT"

      - name: Package
        run: .github/scripts/package-macos.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Runecast-*-macos.*

  linux:
    # The oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          dir=runecast-${TAG#v}-linux-x86_64
          mkdir -p "dist/$dir"
          cp target/release/runecast README.md LICENSE "dist/$dir/"
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  release:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.macos.outputs.signed }}
          SUBMISSION: ${{ needs.macos.outputs.submission }}
        run: |
          if [ "$SIGNED" = 1 ]; then state=pending; else state=unsigned; fi
          {
            echo "## Install on macOS"
            echo
            echo "1. Download \`Runecast-…-macos.dmg\` and drag Runecast to Applications."
            echo "2. Open it. Runecast runs in the background with no Dock icon or window; press **⌥Space** to show it."
            echo "3. In System Settings → Privacy & Security → Accessibility, allow Runecast so it can paste and move windows."
            echo
            .github/scripts/notarization-note.sh print "$state" "$SUBMISSION"
            echo
            echo "## Install on Linux"
            echo
            echo "Extract \`runecast-…-linux-x86_64.tar.gz\` and run \`./runecast\`. Press **Alt+Space** to show it."
            echo
            echo "## What's changed"
            echo
            .github/scripts/changelog.sh notes "$TAG"
          } > notes.md
          cat notes.md
          gh release create "$TAG" dist/* --title "Runecast $TAG" --notes-file notes.md --verify-tag
