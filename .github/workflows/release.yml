name: Release

# Pushing a tag like v0.2.0 builds Runecast.app (Apple Silicon and Intel in one binary) and a
# Linux tarball, then publishes them as a GitHub Release.
#
# The Mac app is signed and notarized when these repository secrets exist, and ad-hoc signed
# (macOS warns on first open) when they don't:
#   MACOS_CERT_P12        Developer ID Application certificate, base64-encoded .p12
#   MACOS_CERT_PASSWORD   its password
#   APPLE_API_KEY         App Store Connect API key, the .p8 file's contents
#   APPLE_API_KEY_ID      the key's ID
#   APPLE_API_ISSUER      the key's issuer ID

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Make Runecast.app
        run: |
          app=dist/Runecast.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/runecast" \
            target/aarch64-apple-darwin/release/runecast target/x86_64-apple-darwin/release/runecast

          iconset=$(mktemp -d)/Runecast.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            sips -z $((size * 2)) $((size * 2)) assets/icon.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/Runecast.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Runecast</string>
            <key>CFBundleDisplayName</key><string>Runecast</string>
            <key>CFBundleIdentifier</key><string>dev.runecast.launcher</string>
            <key>CFBundleExecutable</key><string>runecast</string>
            <key>CFBundleIconFile</key><string>Runecast</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSAppleEventsUsageDescription</key><string>Runecast moves windows and pastes snippets through System Events.</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"

      - name: Sign
        run: |
          app=dist/Runecast.app
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::No Developer ID certificate in secrets; the app is ad-hoc signed and macOS will warn on first open."
            codesign --force --deep --sign - "$app"
            echo "SIGNED=" >> "$GITHUB_ENV"
          else
            keychain="$RUNNER_TEMP/release.keychain-db"
            password=$(openssl rand -hex 16)
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
            # Prepend ours to the search list; the existing keychains are meant to split into arguments.
            # shellcheck disable=SC2046
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"
            identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
            codesign --force --options runtime --timestamp --sign "$identity" "$app"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
          codesign --verify --strict --verbose=2 "$app"

      - name: Notarize
        if: env.SIGNED == '1'
        run: |
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent dist/Runecast.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --key "$RUNNER_TEMP/key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          xcrun stapler staple dist/Runecast.app
          rm "$RUNNER_TEMP/key.p8"

      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent Runecast.app "Runecast-$VERSION-macos.zip"
          mkdir dmg && cp -R Runecast.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Runecast -srcfolder dmg -ov -format UDZO "Runecast-$VERSION-macos.dmg"
          if [ "$SIGNED" = 1 ]; then
            codesign --sign "$(codesign -dvv Runecast.app 2>&1 | sed -n 's/^Authority=\(Developer ID Application.*\)/\1/p' | head -1)" --timestamp "Runecast-$VERSION-macos.dmg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Runecast-*-macos.*

  linux:
    # The oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          version=${GITHUB_REF_NAME#v}
          dir=runecast-$version-linux-x86_64
          mkdir -p "dist/$dir"
          cp target/release/runecast README.md LICENSE "dist/$dir/"
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  release:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install on macOS

          1. Download `Runecast-…-macos.dmg` and drag Runecast to Applications.
          2. Open it. Runecast runs in the background with no Dock icon or window; press **⌥Space** to show it.
          3. In System Settings → Privacy & Security → Accessibility, allow Runecast so it can paste and move windows.

          If macOS says it can't check the app for malicious software, this build isn't notarized yet: open
          System Settings → Privacy & Security and click **Open Anyway**, or run
          `xattr -dr com.apple.quarantine /Applications/Runecast.app`.

          ## Install on Linux

          Extract `runecast-…-linux-x86_64.tar.gz` and run `./runecast`. Press **Alt+Space** to show it.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "Runecast $GITHUB_REF_NAME" --notes "$(cat notes.md)" --generate-notes
