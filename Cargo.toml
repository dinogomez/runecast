[package]
name = "runecast"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Raycast-style launcher built with Rune"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "d751f07106eac47bdd4e33756dee71e1f593c9e2" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "d751f07106eac47bdd4e33756dee71e1f593c9e2" }
arboard = { version = "3.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
png = "0.18"

[profile.release]
lto = "thin"
